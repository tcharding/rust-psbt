[package]
name = "psbt-fuzz"
edition = "2021"
rust-version = "1.74.0"
version = "0.0.1"
authors = ["Generated by fuzz/generate-files.sh"]
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
psbt-v2 = { path = "..", features = ["arbitrary"] }

arbitrary = { version = "1.0.1" }
libfuzzer-sys = { version = "0.4.0" }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
redundant_clone = "warn"
use_self = "warn"

[[bin]]
name = "deserialize_psbt"
path = "fuzz_targets/deserialize_psbt.rs"
test = false
doc = false
bench = false
