name: Setup RBMT
description: Install cargo-rbmt and toolchains for workspace

inputs:
  lockfile:
    description: Lockfile to activate as Cargo.lock (minimal or maximum to leave as-is)
    required: false
    default: maximum

runs:
  using: composite
  steps:
    - name: Install cargo-rbmt
      shell: bash
      run: |
        cargo install \
          --locked \
          cargo-rbmt@$(grep "^rbmt.version" Cargo.toml | cut -d'"' -f2)

    - name: Install toolchains
      shell: bash
      run: cargo rbmt toolchains

    - name: Install tools
      shell: bash
      run: cargo rbmt tools

    - name: Activate lockfile
      shell: bash
      run: cp Cargo-${{ inputs.lockfile }}.lock Cargo.lock
